services:
  db:
    image: postgres:16
    container_name: orders-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders123
    ports:
      - "5432:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: orders-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
    ports:
      - "8080:8080"

volumes:
  orders-db-data:
